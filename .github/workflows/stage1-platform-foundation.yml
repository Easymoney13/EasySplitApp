# Verification sync marker 2; removed before final Stage 1 commit.
name: Stage 1 Platform Foundation Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Stage 1 branch
        uses: actions/checkout@v4
        with:
          ref: stage1-platform-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Stage 1 foundation
        run: python3 .stage1/apply_foundation.py .

      - name: Install dependencies
        run: npm ci

      - name: Full EasySplit verification
        run: npm run verify

      - name: Diff integrity
        run: git diff --check

      - name: Materialize verified Stage 1 commit
        run: |
          rm -rf .stage1
          rm -f .github/workflows/stage1-platform-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add mobile platform foundation"
          git push origin HEAD:stage1-platform-foundation
