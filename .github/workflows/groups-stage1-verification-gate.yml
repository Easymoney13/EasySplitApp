name: Temporary Groups Stage 1 Verification Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Groups Stage 1 branch
        uses: actions/checkout@v4
        with:
          ref: groups-stage1-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Groups Stage 1 patch set
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .stage1 ]; then
            PATCHES=(
              .stage1/01-groupLifecycle.patch
              .stage1/02-groupActions.patch
              .stage1/03-group-lifecycle-tests.patch
              .stage1/04-group-lifecycle-stress.patch
              .stage1/06-db.patch
            )
            git apply --check "${PATCHES[@]}"
            git apply "${PATCHES[@]}"
            python3 .stage1/apply_server.py
          else
            echo "Groups Stage 1 already materialized; verifying current branch."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Full EasySplit verification
        run: npm run verify

      - name: Strain regression
        run: npm run test:strain

      - name: Diff integrity
        run: git diff --check

      - name: Materialize verified Groups Stage 1 commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .stage1
          rm -f .github/workflows/groups-stage1-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Groups Stage 1 lifecycle foundation"
          git push origin HEAD:groups-stage1-foundation
