name: Gate 5 verified tree materialization

on:
  push:
    branches:
      - codex/gate5-materialize-staging
    paths:
      - '.github/workflows/gate5-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Publish clean Gate 5 code tree
        shell: bash
        run: |
          set -euo pipefail
          base=d4e32370134d8fa3f20c49adc1c5f9056ca0fff9
          target=refs/heads/codex/gate5-stage12-current
          test "$(git rev-parse origin/main)" = "$base"
          if git ls-remote --exit-code --heads origin "$target" >/dev/null 2>&1; then
            echo 'Target Gate 5 branch already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          base64 --decode .github/gate5.patch.b64 | gzip -dc > "$RUNNER_TEMP/gate5.patch"
          printf '%s  %s\n' \
            '984a5477fe213ff713e02f9794e117f4007fe7d4246224c7ec98691adc355968' \
            "$RUNNER_TEMP/gate5.patch" | sha256sum --check --strict
          git apply --check --binary --whitespace=error-all "$RUNNER_TEMP/gate5.patch"
          git apply --index --binary --whitespace=error-all "$RUNNER_TEMP/gate5.patch"
          git rm -f .github/gate5.patch.b64 .github/workflows/gate5-materialize.yml
          git diff --cached --check
          full_tree=$(git write-tree)
          test "$full_tree" = 'd1cb2189e45cdf8ad28afa454d4632d1347b13d9'
          cp .github/workflows/mobile-release-dry-run.yml .github/gate5-release-workflow.txt
          git add .github/gate5-release-workflow.txt
          git rm -f .github/workflows/mobile-release-dry-run.yml
          intermediate_tree=$(git write-tree)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n\n%s\n' \
            'feat(gate5): prepare native release validation code' \
            'The reviewed release workflow is staged as data for an authorized connector.' \
            | git commit-tree "$intermediate_tree" -p "$base")
          test "$(git rev-parse "$commit^")" = "$base"
          git push origin "$commit:$target"
