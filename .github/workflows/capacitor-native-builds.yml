name: EasySplit Capacitor Native Builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'lib/**'
      - 'mobile/**'
      - 'src/**'
      - 'tests/mobile-*.test.mjs'
      - 'tests/platform-security.test.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.mobile.config.ts'
      - '.github/validation/**'
      - '.github/workflows/capacitor-native-builds.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'lib/**'
      - 'mobile/**'
      - 'src/**'
      - 'tests/mobile-*.test.mjs'
      - 'tests/platform-security.test.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.mobile.config.ts'
      - '.github/validation/**'
      - '.github/workflows/capacitor-native-builds.yml'

permissions:
  contents: read

concurrency:
  group: easysplit-native-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.2
  NEXT_PUBLIC_EASYSPLIT_API_ORIGIN: https://api.easysplit.invalid
  NEXT_PUBLIC_EASYSPLIT_WEB_ORIGIN: https://easysplit.invalid
  NEXT_PUBLIC_EASYSPLIT_WS_ORIGIN: wss://api.easysplit.invalid

jobs:
  compile-native-projects:
    name: Shared regression + iOS/Android compile + iOS runtime
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install exact dependencies
        run: npm ci

      - name: Verify shared and mobile code
        run: |
          npm run verify
          npm run test:strain
          npm run verify:mobile-shell

      - name: Synchronize native projects
        run: npm run mobile:sync

      - name: Verify synchronized plugins and native config
        shell: bash
        run: |
          set -euo pipefail
          npx cap ls
          git diff --check
          grep -q 'CapacitorAppLauncher' ios/App/CapApp-SPM/Package.swift
          grep -q 'CapacitorShare' ios/App/CapApp-SPM/Package.swift
          grep -q "capacitor-app-launcher" android/app/capacitor.build.gradle
          grep -q "capacitor-share" android/app/capacitor.build.gradle
          grep -q 'X-EasySplit-Client-Id' lib/platformSecurity.js

      - name: Compile iOS simulator without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/EasySplitDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Install, launch, and deep-link iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/easysplit-ios-smoke"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/easysplit-ios-smoke/devices.json"
          UDID=$(node - "$RUNNER_TEMP/easysplit-ios-smoke/devices.json" <<'NODE'
          const fs = require('fs');
          const devices = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).devices || {};
          for (const [runtime, entries] of Object.entries(devices)) {
            if (!runtime.includes('iOS')) continue;
            const device = entries.find((entry) => entry.isAvailable && /^iPhone/.test(entry.name));
            if (device) {
              process.stdout.write(device.udid);
              process.exit(0);
            }
          }
          process.exit(1);
          NODE
          )
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH="$RUNNER_TEMP/EasySplitDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl get_app_container "$UDID" com.easysplit.app app
          xcrun simctl launch "$UDID" com.easysplit.app | tee "$RUNNER_TEMP/easysplit-ios-smoke/launch.txt"
          sleep 3
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/easysplit-ios-smoke/home.png"
          xcrun simctl openurl "$UDID" 'easysplit://session/smoke-session?groupId=smoke-group#invite=smoke-token'
          sleep 2
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/easysplit-ios-smoke/live-deep-link.png"
          xcrun simctl terminate "$UDID" com.easysplit.app
          xcrun simctl openurl "$UDID" 'easysplit://group/smoke-group'
          sleep 2
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/easysplit-ios-smoke/cold-deep-link.png"
          xcrun simctl spawn "$UDID" log show --style compact --last 3m --predicate 'process == "App"' > "$RUNNER_TEMP/easysplit-ios-smoke/app.log" || true
          if grep -E 'Fatal error|SIGABRT|Terminating app due to uncaught exception' "$RUNNER_TEMP/easysplit-ios-smoke/app.log"; then
            echo 'iOS runtime crash signature detected' >&2
            exit 1
          fi
          echo 'IOS_SIMULATOR_INSTALL=PASS'
          echo 'IOS_SIMULATOR_LAUNCH=PASS'
          echo 'IOS_LIVE_DEEP_LINK_DISPATCH=PASS'
          echo 'IOS_COLD_DEEP_LINK_DISPATCH=PASS'

      - name: Compile Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: easysplit-android-debug-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload iOS runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easysplit-ios-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/easysplit-ios-smoke
          if-no-files-found: warn
          retention-days: 7

  android-api-36-runtime:
    name: Android 16 install + launch + Back + deep links
    needs: compile-native-projects
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install exact dependencies for runtime harness
        run: npm ci

      - name: Download compiled Android APK
        uses: actions/download-artifact@v5
        with:
          name: easysplit-android-debug-${{ github.run_id }}
          path: android-runtime

      - name: Run Android 16 native runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics
          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
            adb devices
          script: bash .github/validation/run-native-android-runtime.sh "$RUNNER_TEMP/easysplit-android-smoke" android-runtime/app-debug.apk

      - name: Require Android runtime PASS evidence
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/easysplit-android-smoke/result.txt"
          EXIT_CODE="$RUNNER_TEMP/easysplit-android-smoke/exit-code.txt"
          SCREENSHOT="$RUNNER_TEMP/easysplit-android-smoke/final.png"
          LOGCAT="$RUNNER_TEMP/easysplit-android-smoke/logcat.txt"
          test -s "$RESULT"
          test -s "$EXIT_CODE"
          test -s "$SCREENSHOT"
          test -s "$LOGCAT"
          cat "$RESULT"
          test "$(cat "$EXIT_CODE")" -eq 0
          for marker in \
            ANDROID_GESTURE_NAVIGATION=PASS \
            ANDROID_COLD_LAUNCH=PASS \
            ANDROID_GUEST_LIVE_CONTINUITY=PASS \
            ANDROID_GUEST_COLD_CONTINUITY=PASS \
            ANDROID_BACK_SHEET_DISMISS=PASS \
            ANDROID_LIVE_DEEP_LINK=PASS \
            ANDROID_COLD_DEEP_LINK=PASS \
            ANDROID_BACK_ROOT=PASS \
            ANDROID_BACKGROUND_RESUME=PASS \
            ANDROID_CRASH_ANR_SCAN=PASS
          do
            grep -Fxq "$marker" "$RESULT"
          done

      - name: Upload Android runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easysplit-android-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/easysplit-android-smoke
          if-no-files-found: warn
          retention-days: 7
