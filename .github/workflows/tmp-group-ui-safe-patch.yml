name: Temporary Group UI Safety Check

on:
  push:
    branches:
      - ui/group-scan-receipt-cta

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_EASYSPLIT_API_ORIGIN: https://api.easysplit.invalid
      NEXT_PUBLIC_EASYSPLIT_WEB_ORIGIN: https://easysplit.invalid
    steps:
      - name: Checkout isolated UI branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm

      - name: Apply only the approved group-workspace UI patch
        run: python3 scripts/tmp-group-ui-safe-patch.py

      - name: Verify diff scope before tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "src/app/group/[id]/page.tsx"

      - name: Install exact dependency graph
        run: npm ci

      - name: Run full existing verification suite
        run: npm run verify

      - name: Run existing strain regression
        run: npm run test:strain

      - name: Commit only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "src/app/group/[id]/page.tsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "src/app/group/[id]/page.tsx"
          git commit -m "feat(ui): surface receipt scan in group workspace"
          git push origin HEAD:ui/group-scan-receipt-cta
