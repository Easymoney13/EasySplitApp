name: Gate 1+2 Native Validation

on:
  push:
    branches:
      - validation-gate12-native-20260828
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate12-native-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.2
  NEXT_PUBLIC_EASYSPLIT_API_ORIGIN: https://billspltapp.onrender.com
  NEXT_PUBLIC_EASYSPLIT_WEB_ORIGIN: https://billspltapp.onrender.com
  NEXT_PUBLIC_EASYSPLIT_WS_ORIGIN: wss://billspltapp.onrender.com

# Run 12 already proved the unchanged candidate on the full web regression,
# live native CORS probe, iOS compile, install, and cold launch. This final
# workflow is Android-only and runs the x86_64 emulator on an Intel macOS
# runner so Android 16 has hardware acceleration instead of timing out without KVM.
jobs:
  android-api-36:
    name: Android 16 / API 36 final device smoke
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v5

      - name: Apply unchanged isolated Gate 1+2 candidate
        run: |
          python3 .github/validation/apply-gate12-candidate.py
          git diff --check
          git diff --stat
          mkdir -p "$RUNNER_TEMP/gate12-android"
          git diff > "$RUNNER_TEMP/gate12-android/candidate.diff"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact dependency graph
        run: npm ci

      - name: Validate candidate contracts and TypeScript
        run: |
          node --test tests/platform-security.test.js tests/mobile-integration-static.test.mjs
          npm run typecheck
          npm run mobile:build
          npx cap sync android

      - name: Build signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace \
            | tee "$RUNNER_TEMP/gate12-android/gradle-build.log"
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" \
            | tee "$RUNNER_TEMP/gate12-android/apk-signing.txt"

      - name: Run Android 16 native Back and background smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
            adb devices
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            node .github/validation/validate-android-back.mjs | tee "$RUNNER_TEMP/gate12-android/android-smoke-result.txt"
            adb exec-out screencap -p > "$RUNNER_TEMP/gate12-android/android-home.png"
            adb logcat -d -v threadtime > "$RUNNER_TEMP/gate12-android/logcat.txt"

      - name: Publish Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate12-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate12-android
          if-no-files-found: warn
          retention-days: 7
