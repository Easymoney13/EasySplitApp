name: EasySplit Stage 2 — Native Runtime Baseline

on:
  push:
    branches:
      - stage2-native-runtime-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easysplit-stage2-native-runtime-baseline
  cancel-in-progress: true

jobs:
  verify-native-runtime-baseline:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_EASYSPLIT_API_ORIGIN: https://api.easysplit.invalid
      NEXT_PUBLIC_EASYSPLIT_WEB_ORIGIN: https://easysplit.invalid
    steps:
      - name: Checkout Stage 2 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Verify native toolchains
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          java -version
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR==1 {split($2, version, "."); print version[1]}')"
          if [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "Capacitor 8 requires Xcode 26+, runner has $(xcodebuild -version | head -1)" >&2
            exit 1
          fi
          command -v sdkmanager
          sdkmanager --version

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install exact JavaScript dependency graph
        run: npm ci

      - name: Validate repaired native metadata before builds
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse ios/App/CapApp-SPM/Package.swift
          grep -F "../../../node_modules/@capacitor/camera" ios/App/CapApp-SPM/Package.swift >/dev/null
          grep -F "../../../node_modules/@capacitor/haptics" ios/App/CapApp-SPM/Package.swift >/dev/null
          grep -F "include ':capacitor-camera'" android/capacitor.settings.gradle >/dev/null
          grep -F "include ':capacitor-haptics'" android/capacitor.settings.gradle >/dev/null
          grep -F "implementation project(':capacitor-camera')" android/app/capacitor.build.gradle >/dev/null
          grep -F "implementation project(':capacitor-haptics')" android/app/capacitor.build.gradle >/dev/null

      - name: Protect the existing web baseline
        run: npm run verify

      - name: Run existing strain regression
        run: npm run test:strain

      - name: Verify and build the packaged mobile bundle
        run: npm run verify:mobile-shell

      - name: Synchronize native projects and assert deterministic output
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync
          swiftc -parse ios/App/CapApp-SPM/Package.swift
          git diff --check
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Capacitor sync changed tracked files; native projects are not synchronized." >&2
            git status --short --untracked-files=no >&2
            git diff -- ios android >&2
            exit 1
          fi

      - name: Compile iOS simulator build without signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            XCODE_CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            XCODE_CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild \
            "${XCODE_CONTAINER[@]}" \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/EasySplitStage2DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Compile Android debug build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Re-sync after compilation and verify clean working tree
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync
          swiftc -parse ios/App/CapApp-SPM/Package.swift
          git diff --check
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Native compilation or re-sync changed tracked files." >&2
            git status --short --untracked-files=no >&2
            git diff >&2
            exit 1
          fi
