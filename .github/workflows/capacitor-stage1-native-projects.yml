name: EasySplit Capacitor Stage 1 — Native Projects

on:
  push:
    branches:
      - capacitor-stage1-native-projects

permissions:
  contents: write

concurrency:
  group: easysplit-capacitor-stage1-native-projects
  cancel-in-progress: true

jobs:
  generate-sync-and-compile:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_EASYSPLIT_API_ORIGIN: https://api.easysplit.invalid
      NEXT_PUBLIC_EASYSPLIT_WEB_ORIGIN: https://easysplit.invalid
    steps:
      - name: Checkout isolated Stage 1 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm

      - name: Set up Java 21 for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Verify native toolchain requirements
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          xcodebuild -version
          java -version
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')"
          if [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "Capacitor 8 requires Xcode 26+, runner has $(xcodebuild -version | head -1)" >&2
            exit 1
          fi
          command -v sdkmanager
          sdkmanager --version

      - name: Ensure Android API 36 toolchain is present
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install exact JavaScript dependency graph
        run: npm ci

      - name: Protect the existing web baseline
        run: npm run verify

      - name: Run existing strain regression
        run: npm run test:strain

      - name: Verify and build the packaged mobile bundle
        run: npm run verify:mobile-shell

      - name: Assert clean pre-platform state
        shell: bash
        run: |
          set -euo pipefail
          test -f mobile-dist/index.html
          test ! -e ios
          test ! -e android
          git diff --check

      - name: Generate Capacitor iOS project using the Capacitor 8 default SPM flow
        run: npx cap add ios

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Synchronize bundled assets and native plugins
        run: npx cap sync

      - name: Validate generated native project structure and synchronized assets
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/Info.plist
          test -f ios/App/App/public/index.html
          test -f ios/App/App/capacitor.config.json
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/capacitor.config.json
          grep -R "com.easysplit.app" ios/App android/app/src/main android/app/build.gradle* >/dev/null
          npx cap ls
          git diff --check

      - name: Compile iOS simulator build without signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            XCODE_CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            XCODE_CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild \
            "${XCODE_CONTAINER[@]}" \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/EasySplitDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Compile Android debug build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Re-sync after native compile and assert reproducibility
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync
          test -f ios/App/App/public/index.html
          test -f android/app/src/main/assets/public/index.html
          test ! -d ios/App/App.xcodeproj/xcuserdata
          git diff --check

      - name: Write the Stage 1 handoff
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse origin/main)" python3 - <<'PY'
          import os
          from pathlib import Path

          base_sha = os.environ['BASE_SHA']
          content = f"""# Capacitor Stage 1 — Native Projects Handoff

          ## Measurable outcome

          EasySplit now has generated Capacitor 8 native projects for both iOS and Android, sourced from the existing mobile-dist build path without replacing or changing the web deployment path.

          ## Verified baseline

          - Base main: `{base_sha}`
          - App ID: `com.easysplit.app`
          - App name: `EasySplit`
          - Capacitor: `8.5.0`
          - iOS dependency manager: Swift Package Manager (Capacitor 8 default)
          - Web verification: passed
          - Hebrew OCR integration: passed
          - Strain regression: passed
          - Mobile shell tests and Vite production build: passed
          - `npx cap sync`: passed for iOS and Android
          - iOS simulator compilation without signing: passed
          - Android debug compilation: passed

          ## Handoff commands

          From a clean checkout with Node 22+:

          ```bash
          npm ci
          NEXT_PUBLIC_EASYSPLIT_API_ORIGIN=https://YOUR_BACKEND NEXT_PUBLIC_EASYSPLIT_WEB_ORIGIN=https://YOUR_PUBLIC_WEB npm run mobile:sync
          npx cap open ios
          npx cap open android
          ```

          ## Explicitly not included in Stage 1

          - Apple or Google signing
          - Store accounts or uploads
          - Production mobile environment values
          - Emulator/device core-flow testing
          - Native Camera, Share, Haptics or Deep Links
          - Product/UI changes

          The web application remains the unchanged source of truth. Generated native build artifacts remain ignored; the maintainable iOS and Android projects are version-controlled.
          """
          Path('docs/capacitor-stage1-handoff.md').write_text(content, encoding='utf-8')
          PY

      - name: Stage the generated Stage 1 result
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTICS="${RUNNER_TEMP}/stage1-finalizer"
          mkdir -p "${DIAGNOSTICS}"
          git add --all -- ios android docs/capacitor-stage1-handoff.md
          git status --porcelain=v1 --untracked-files=all | tee "${DIAGNOSTICS}/status-after-stage.txt"
          git diff --cached --name-status | tee "${DIAGNOSTICS}/staged-name-status.txt"
          git diff --cached --stat | tee "${DIAGNOSTICS}/staged-stat.txt"
          git diff --cached --quiet && {
            echo "No Stage 1 changes were produced" | tee "${DIAGNOSTICS}/stage-error.txt" >&2
            exit 1
          }

      - name: Validate the exact staged mutation surface
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTICS="${RUNNER_TEMP}/stage1-finalizer"
          python3 - <<'PY' | tee "${DIAGNOSTICS}/staged-path-validation.txt"
          import subprocess

          paths = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines()
          unexpected = [
              path for path in paths
              if not (
                  path.startswith("ios/")
                  or path.startswith("android/")
                  or path == "docs/capacitor-stage1-handoff.md"
              )
          ]
          if unexpected:
              raise SystemExit(
                  "Unexpected staged paths:\n" + "\n".join(unexpected)
              )
          required = {
              "ios": any(path.startswith("ios/") for path in paths),
              "android": any(path.startswith("android/") for path in paths),
              "handoff": "docs/capacitor-stage1-handoff.md" in paths,
          }
          missing = [name for name, present in required.items() if not present]
          if missing:
              raise SystemExit(
                  "Missing required Stage 1 outputs: " + ", ".join(missing)
              )
          print(f"Validated {len(paths)} staged paths; mutation surface is restricted to ios/, android/, and the handoff.")
          PY

      - name: Validate staged diff integrity
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTICS="${RUNNER_TEMP}/stage1-finalizer"
          if ! git diff --cached --check >"${DIAGNOSTICS}/diff-check.txt" 2>&1; then
            cat "${DIAGNOSTICS}/diff-check.txt" >&2
            exit 1
          fi
          echo "Staged diff integrity check passed." | tee "${DIAGNOSTICS}/diff-check.txt"

      - name: Create the single Stage 1 result commit
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTICS="${RUNNER_TEMP}/stage1-finalizer"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git commit -m "Initialize Capacitor iOS and Android projects [skip ci]" >"${DIAGNOSTICS}/commit.txt" 2>&1; then
            cat "${DIAGNOSTICS}/commit.txt" >&2
            exit 1
          fi
          cat "${DIAGNOSTICS}/commit.txt"

      - name: Verify the result commit and clean working tree
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTICS="${RUNNER_TEMP}/stage1-finalizer"
          python3 - <<'PY' | tee "${DIAGNOSTICS}/commit-path-validation.txt"
          import subprocess

          paths = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          unexpected = [
              path for path in paths
              if not (
                  path.startswith("ios/")
                  or path.startswith("android/")
                  or path == "docs/capacitor-stage1-handoff.md"
              )
          ]
          if unexpected:
              raise SystemExit(
                  "Unexpected committed paths:\n" + "\n".join(unexpected)
              )
          if not any(path.startswith("ios/") for path in paths):
              raise SystemExit("The result commit does not contain ios/.")
          if not any(path.startswith("android/") for path in paths):
              raise SystemExit("The result commit does not contain android/.")
          if "docs/capacitor-stage1-handoff.md" not in paths:
              raise SystemExit("The result commit does not contain the Stage 1 handoff.")
          print(f"Validated {len(paths)} committed paths.")
          PY
          git show --stat --oneline --summary HEAD | tee "${DIAGNOSTICS}/commit-summary.txt"
          DIRTY="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "${DIRTY}" ]; then
            printf '%s\n' "${DIRTY}" | tee "${DIAGNOSTICS}/dirty-after-commit.txt" >&2
            exit 1
          fi
          echo "Working tree is clean after the result commit." | tee "${DIAGNOSTICS}/clean-tree.txt"

      - name: Push the verified Stage 1 result commit
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTICS="${RUNNER_TEMP}/stage1-finalizer"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/capacitor-stage1-native-projects | awk '{print $1}')"
          EXPECTED_PARENT="$(git rev-parse HEAD^)"
          {
            echo "remote_head=${REMOTE_HEAD}"
            echo "expected_parent=${EXPECTED_PARENT}"
            echo "result_commit=$(git rev-parse HEAD)"
          } | tee "${DIAGNOSTICS}/push-precondition.txt"
          if [ "${REMOTE_HEAD}" != "${EXPECTED_PARENT}" ]; then
            echo "Remote branch moved during the verified run; refusing a non-fast-forward or stale push." | tee "${DIAGNOSTICS}/push-error.txt" >&2
            exit 1
          fi
          if ! git push --porcelain origin HEAD:capacitor-stage1-native-projects >"${DIAGNOSTICS}/push.txt" 2>&1; then
            cat "${DIAGNOSTICS}/push.txt" >&2
            exit 1
          fi
          cat "${DIAGNOSTICS}/push.txt"
          REMOTE_AFTER="$(git ls-remote origin refs/heads/capacitor-stage1-native-projects | awk '{print $1}')"
          test "${REMOTE_AFTER}" = "$(git rev-parse HEAD)"
          echo "remote_after=${REMOTE_AFTER}" | tee "${DIAGNOSTICS}/push-confirmation.txt"

      - name: Upload finalizer diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-stage1-finalizer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage1-finalizer
          if-no-files-found: warn
          retention-days: 7
