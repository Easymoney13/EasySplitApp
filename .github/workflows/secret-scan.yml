name: EasySplit Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easysplit-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
      - name: Download and verify pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/easysplit-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          echo "GITLEAKS_BIN=$scanner_dir/gitleaks" >> "$GITHUB_ENV"
      - name: Prove scanner detects credentials and scopes the public client exception
        run: node --test tests/secret-scanning.integration.mjs
      - name: Scan all tracked source files with redacted output
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$RUNNER_TEMP/easysplit-secret-snapshot"
          mkdir -p "$scan_dir"
          git archive HEAD | tar -x -C "$scan_dir"
          cd "$scan_dir"
          "$GITLEAKS_BIN" dir . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/easysplit-secret-scan-redacted.json"
