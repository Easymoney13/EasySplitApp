name: EasySplit Native Google Auth — Isolated Validation

on:
  push:
    branches:
      - ci/native-google-auth-validation-20260827

permissions:
  contents: read

concurrency:
  group: easysplit-native-google-auth-isolated
  cancel-in-progress: true

jobs:
  validate-native-google-auth:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_EASYSPLIT_API_ORIGIN: https://api.easysplit.invalid
      NEXT_PUBLIC_EASYSPLIT_WEB_ORIGIN: https://easysplit.invalid
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android toolchain
        uses: android-actions/setup-android@v3

      - name: Verify native toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          java -version
          xcodebuild -version
          command -v sdkmanager
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')"
          if [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "Capacitor 8 requires Xcode 26+, runner has $(xcodebuild -version | head -1)" >&2
            exit 1
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Capture the existing dependency audit baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit-baseline.json"
          AUDIT_RC=$?
          set -e
          test -s "$RUNNER_TEMP/audit-baseline.json"
          echo "Baseline npm audit exit code: ${AUDIT_RC} (non-zero is expected when the existing repository has advisories)."

      - name: Apply the exact isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .ci/native-google-auth-candidate.patch
          git apply .ci/native-google-auth-candidate.patch
          git diff --check
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u | tee /tmp/google-auth-changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed = {
              'package.json',
              'package-lock.json',
              'ios/App/App/Info.plist',
              'ios/App/CapApp-SPM/Package.swift',
              'android/capacitor.settings.gradle',
              'android/app/capacitor.build.gradle',
              'lib/nativeGoogleAuth.ts',
              'tests/mobile-google-auth-static.test.mjs',
              'src/components/LanguageContext.tsx',
          }
          changed = set(Path('/tmp/google-auth-changed-files.txt').read_text().splitlines())
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit('Unexpected candidate paths:\n' + '\n'.join(unexpected))
          if missing:
              raise SystemExit('Missing candidate paths:\n' + '\n'.join(missing))
          print(f'Candidate mutation surface verified: {len(changed)} files')
          PY

      - name: Install exact dependency graph
        run: npm ci

      - name: Verify dependency resolution and audit delta
        shell: bash
        run: |
          set -euo pipefail
          npm ls @capawesome/capacitor-google-sign-in @capacitor/core firebase
          set +e
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit-candidate.json"
          AUDIT_RC=$?
          set -e
          test -s "$RUNNER_TEMP/audit-candidate.json"
          echo "Candidate npm audit exit code: ${AUDIT_RC}. Comparing it with the unchanged baseline."
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          baseline = json.loads((temp / 'audit-baseline.json').read_text())
          candidate = json.loads((temp / 'audit-candidate.json').read_text())

          severe = {'high', 'critical'}

          def counts(report):
              values = report.get('metadata', {}).get('vulnerabilities', {})
              return {level: int(values.get(level, 0) or 0) for level in severe}

          def severe_advisories(report):
              found = set()
              for package, details in report.get('vulnerabilities', {}).items():
                  if details.get('severity') not in severe:
                      continue
                  vias = details.get('via', [])
                  for via in vias:
                      if isinstance(via, dict) and via.get('severity') in severe:
                          identity = via.get('source') or via.get('url') or via.get('title')
                          found.add((package, str(identity), via.get('severity')))
              return found

          baseline_counts = counts(baseline)
          candidate_counts = counts(candidate)
          new_severe = sorted(severe_advisories(candidate) - severe_advisories(baseline))
          increased = {
              level: (baseline_counts[level], candidate_counts[level])
              for level in severe
              if candidate_counts[level] > baseline_counts[level]
          }

          print('Existing high/critical audit baseline:', baseline_counts)
          print('Candidate high/critical audit result:', candidate_counts)
          if new_severe:
              print('New severe advisories introduced by the candidate:')
              for item in new_severe:
                  print(' -', item)
          if increased or new_severe:
              raise SystemExit(
                  'Native Google Auth candidate introduces a new high/critical dependency risk: '
                  + repr({'increased': increased, 'new': new_severe})
              )
          print('PASS: candidate adds no high/critical advisory beyond the existing repository baseline.')
          PY

      - name: Protect the existing web and OCR baseline
        run: npm run verify

      - name: Run strain regression
        run: npm run test:strain

      - name: Build and test the mobile shell
        run: npm run verify:mobile-shell

      - name: Synchronize native projects
        run: npx cap sync

      - name: Re-run Google Auth guards after Capacitor sync
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mobile-google-auth-static.test.mjs
          grep -q "CapawesomeCapacitorGoogleSignIn" ios/App/CapApp-SPM/Package.swift
          grep -q "capawesome-capacitor-google-sign-in" android/capacitor.settings.gradle
          grep -q "capawesome-capacitor-google-sign-in" android/app/capacitor.build.gradle
          git diff --check

      - name: Compile iOS simulator build without signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            XCODE_CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            XCODE_CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild \
            "${XCODE_CONTAINER[@]}" \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/EasySplitGoogleAuthDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Compile Android debug build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run auth security checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=node_modules --exclude='*.patch' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|private_key_id|client_secret)' \
            lib src ios android tests package.json package-lock.json
          ! grep -RInE --exclude-dir=node_modules \
            '(localStorage|sessionStorage|document\.cookie).*(idToken|accessToken|serverAuthCode)' \
            lib/nativeGoogleAuth.ts src/components/LanguageContext.tsx
          ! grep -RInE --exclude-dir=node_modules \
            'console\.(log|debug).*?(idToken|accessToken|serverAuthCode)' \
            lib/nativeGoogleAuth.ts src/components/LanguageContext.tsx

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/google-auth-diagnostics"
          git status --short > "$RUNNER_TEMP/google-auth-diagnostics/status.txt" || true
          git diff --stat > "$RUNNER_TEMP/google-auth-diagnostics/diff-stat.txt" || true
          git diff --name-status > "$RUNNER_TEMP/google-auth-diagnostics/diff-name-status.txt" || true
          git diff > "$RUNNER_TEMP/google-auth-diagnostics/candidate.diff" || true
          git ls-files --others --exclude-standard > "$RUNNER_TEMP/google-auth-diagnostics/untracked.txt" || true
          cp "$RUNNER_TEMP/audit-baseline.json" "$RUNNER_TEMP/google-auth-diagnostics/audit-baseline.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/audit-candidate.json" "$RUNNER_TEMP/google-auth-diagnostics/audit-candidate.json" 2>/dev/null || true
          node --version > "$RUNNER_TEMP/google-auth-diagnostics/node.txt" || true
          xcodebuild -version > "$RUNNER_TEMP/google-auth-diagnostics/xcode.txt" || true
          (cd android && ./gradlew signingReport --no-daemon) > "$RUNNER_TEMP/google-auth-diagnostics/android-signing-report.txt" 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-google-auth-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/google-auth-diagnostics
          if-no-files-found: warn
          retention-days: 7
